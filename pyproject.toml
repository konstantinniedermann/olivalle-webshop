[project]
name = "olivalle"
version = "1.3"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "pydantic-settings>=2.7",
    "stripe>=12",
    "brevo-python>=4",
    "qrbill>=1.1",
    "fpdf2>=2.8",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.9",
    "boto3>=1.34",
    "moto[s3]>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9",
    "mkdocs-mermaid2-plugin>=1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
