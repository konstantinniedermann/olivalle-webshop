<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Olivalle{% endblock %} — Biologisches Olivenöl</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ app_version }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        main { animation: fadeIn 0.4s ease-in; }
    </style>
    {# cart.js muss im <head> stehen, damit getCart/getCartTotal etc. beim Parsen
       inline <script>-Bloecke im Body (checkout.html, warenkorb.html) bereits
       verfuegbar sind. DOMContentLoaded-Listener in cart.js feuern wie gehabt. #}
    <script src="/static/js/cart.js?v={{ app_version }}"></script>
</head>
<body class="bg-stone-800 text-white min-h-screen flex flex-col font-body">
    <header class="sticky top-0 z-50 bg-stone-800/90 backdrop-blur-sm border-b border-stone-700 py-4">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between gap-4">
            <a href="/" class="font-display text-4xl font-bold text-accent shrink-0">Olivalle</a>
            <div class="flex items-center gap-1.5 sm:gap-3">
                <nav class="flex items-center gap-1.5 sm:gap-3 text-sm">
                    <a href="/ueber-das-oel"
                       class="whitespace-nowrap rounded-full px-2.5 py-1 sm:px-3 border transition-all duration-200 {% if active_page == 'ueber-das-oel' %}border-accent/60 bg-stone-700 text-accent{% else %}border-stone-600 text-stone-300 hover:bg-stone-700 hover:text-white{% endif %}">
                        Über das Öl
                    </a>
                    <a href="/"
                       class="whitespace-nowrap rounded-full px-2.5 py-1 sm:px-3 border transition-all duration-200 {% if active_page == 'produkte' %}border-accent/60 bg-stone-700 text-accent{% else %}border-stone-600 text-stone-300 hover:bg-stone-700 hover:text-white{% endif %}">
                        Produkte
                    </a>
                </nav>
                <div class="relative">
                    <a href="/warenkorb"
                       class="whitespace-nowrap text-sm rounded-full px-2.5 py-1 sm:px-3 border transition-all duration-200 {% if active_page == 'warenkorb' %}border-accent/60 bg-stone-700 text-accent{% else %}border-stone-600 text-stone-300 hover:bg-stone-700 hover:text-white{% endif %}">
                        <span class="hidden sm:inline">Warenkorb</span><svg class="sm:hidden inline w-4 h-4 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> (<span id="cart-count">0</span>)
                    </a>
                    <div id="cart-flyout" class="absolute right-0 top-full mt-2 w-72 bg-stone-700 rounded-lg shadow-lg border border-stone-600 z-50 p-4 opacity-0 pointer-events-none translate-y-1 transition-all duration-300 ease-out">
                        <div id="cart-flyout-items" class="text-sm space-y-2 mb-3"></div>
                        <div class="border-t border-stone-600 pt-2 flex justify-between font-bold text-sm">
                            <span>Total</span>
                            <span id="cart-flyout-total"></span>
                        </div>
                        <div class="mt-3 flex gap-2 text-sm">
                            <a href="/warenkorb" class="flex-1 text-center py-2 border border-stone-500 rounded hover:bg-stone-600 transition-colors">Warenkorb</a>
                            <a href="/checkout" class="flex-1 text-center py-2 bg-accent text-stone-900 rounded font-bold hover:bg-yellow-400 transition-colors">Zur Kasse</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-stone-700 py-6 text-center text-stone-400 text-sm">
        <div class="max-w-4xl mx-auto px-4">
            <p>&copy; Olivalle — Biologisches Olivenöl aus Andalusien</p>
            <p class="mt-1">
                <a href="/impressum" class="hover:text-accent">Impressum</a> ·
                <a href="/datenschutz" class="hover:text-accent">Datenschutz</a> ·
                <a href="/agb" class="hover:text-accent">AGB</a>
            </p>
            <p class="mt-2 text-xs text-stone-600">{{ app_version }}</p>
        </div>
    </footer>
</body>
</html>
