name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Ruff Check
        run: uv run ruff check app tests scripts
      - name: Ruff Format Check
        run: uv run ruff format --check app tests scripts
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0 (tag has no v-prefix)
        with:
          scandir: '.'
          additional_files: 'entrypoint.sh'
