name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Ruff Check
        run: uv run ruff check app tests scripts
      - name: Ruff Format Check
        run: uv run ruff format --check app tests scripts
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0 (tag has no v-prefix)
        with:
          scandir: '.'
          additional_files: 'entrypoint.sh'
