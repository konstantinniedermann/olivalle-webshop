name: Deploy olivalle

on:
  push:
    branches: [main]
    # Reine Doku-Änderungen brauchen keinen App-Deploy (kein Runtime-Einfluss,
    # die App serviert keine .md-Dateien). Pages-Deploy läuft separat über docs.yml.
    # paths-ignore greift nur, wenn ALLE geänderten Dateien matchen — gemischte
    # Commits (Code + Doku) deployen weiterhin. workflow_dispatch ignoriert den Filter.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  # Supply-Chain-Guard (#179): blockt nur OSV-Einträge mit Prefix MAL-
  # (OpenSSF Malicious Packages) in beiden Lockfiles. Normale Vulns brechen
  # den Build bewusst nicht (sonst ab der ersten Dev-Dep-CVE dauerrot).
  # Version gepinnt — ein Supply-Chain-Guard zieht sich nicht von "latest".
  osv-gate:
    name: OSV Malware Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Least Privilege: Job führt ein fremdes Binary aus
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: OSV malware scan (uv.lock + package-lock.json)
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          # Inhalt verifizieren, nicht nur den Tag: Release-Assets sind für einen
          # bestehenden Tag austauschbar (Hash aus osv-scanner_SHA256SUMS v2.4.0).
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  /tmp/osv-scanner" | sha256sum -c -
          ec=0
          /tmp/osv-scanner scan --lockfile=uv.lock --lockfile=package-lock.json \
            --format json > /tmp/osv.json || ec=$?
          # exit 1 = "Findings vorhanden" (normal, wird unten gefiltert);
          # alles > 1 = echter Scanner-Fehler -> fail closed.
          if [ "$ec" -gt 1 ]; then
            echo "osv-scanner fehlgeschlagen (exit $ec)"; exit "$ec"
          fi
          python3 scripts/ci/osv_malware_gate.py /tmp/osv.json

  build:
    name: Docker Build & Push
    needs: [test, osv-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.image_ref.outputs.ref }}
      app_version: ${{ env.APP_VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Compute APP_VERSION
        run: |
          MINOR=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          git fetch --tags
          PATCH=$(git tag --list "v${MINOR}.*" | wc -l | tr -d ' ')
          PATCH=$((PATCH + 1))
          APP_VERSION="v${MINOR}.${PATCH}"
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "Computed version: ${APP_VERSION}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/konstantinniedermann/olivalle
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

      - name: Set image ref output
        id: image_ref
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "ref=ghcr.io/konstantinniedermann/olivalle:${SHA}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to fly.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # 1.6

      - name: Deploy ${{ needs.build.outputs.app_version }} to fly.io
        run: flyctl deploy --app olivalle --image ${{ needs.build.outputs.image_sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Summary schreiben
        run: |
          echo "## Deployment erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ needs.build.outputs.app_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Git-Tag setzen
        run: |
          APP_VERSION="${{ needs.build.outputs.app_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$APP_VERSION"
          git push origin "$APP_VERSION"
