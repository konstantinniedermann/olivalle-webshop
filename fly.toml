# fly.toml app configuration file generated for olivalle on 2026-03-25T10:21:05+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'olivalle'
primary_region = 'cdg'

[build]

[env]
  DATABASE_PATH = '/data/olivalle.db'

[[mounts]]
  source = 'olivalle_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
